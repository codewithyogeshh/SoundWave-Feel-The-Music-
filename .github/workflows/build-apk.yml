name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.2.0"
        required: true
        default: "v1.2.0"
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          to_number() { case "${1:-}" in ''|*[!0-9]*) echo 0 ;; *) echo "$1" ;; esac; }

          if [ -n "${INPUT_VERSION:-}" ]; then
            # Manual run: the tag is given by hand.
            TAG="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Pushed tag: use it as is.
            TAG="$GITHUB_REF_NAME"
          else
            # Push to main with code/asset changes: bump the patch of the newest
            # release, so the app on the phone sees a newer version and offers
            # the update. No manual workflow run or version edit needed.
            latest=$(curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
              | jq -r '.tag_name // empty' 2>/dev/null) || latest=""
            if [ -z "$latest" ]; then
              latest=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d'+' -f1 | tr -d ' ')
              latest="v$latest"
            fi
            core="${latest#v}"; core="${core#V}"
            major=$(to_number "$(echo "$core" | cut -d. -f1)")
            minor=$(to_number "$(echo "$core" | cut -d. -f2)")
            patch=$(to_number "$(echo "$core" | cut -d. -f3)")
            TAG="v${major}.${minor}.$((patch + 1))"
          fi

          VERSION="${TAG#v}"; VERSION="${VERSION#V}"
          major=$(to_number "$(echo "$VERSION" | cut -d. -f1)")
          minor=$(to_number "$(echo "$VERSION" | cut -d. -f2)")
          patch=$(to_number "$(echo "$VERSION" | cut -d. -f3)")
          # Android versionCode must keep growing; derive it from the version.
          BUILD_NUMBER=$((major * 10000 + minor * 100 + patch))

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Will build $TAG as versionName $VERSION, versionCode $BUILD_NUMBER"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Every APK must be signed with the SAME key, otherwise Android refuses
      # to install an update over the installed app ("App not installed").
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SOUNDWAVE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SOUNDWAVE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOUNDWAVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SOUNDWAVE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::Signing secrets are missing, falling back to the debug keystore. In-app updates will not install over an existing app."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/soundwave-release.jks
          {
            echo "storeFile=soundwave-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured."

      - name: Build release APK
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          echo "Baking app version ${{ steps.version.outputs.version }} into the build"
          flutter build apk --release --verbose \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build_number }}" \
            --dart-define=SOUNDWAVE_VERSION="${{ steps.version.outputs.version }}"

      - name: Collect APK
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -uo pipefail
          echo "--- top level"; ls -la
          echo "--- apk search"
          find . -name "*.apk" -not -path "*/.pub-cache/*" 2>/dev/null | head -n 20
          apk=$(find . -path "*release*" -name "*.apk" -not -path "*/.pub-cache/*" 2>/dev/null | head -n 1)
          if [ -z "$apk" ]; then
            apk=$(find . -name "*.apk" -not -path "*/.pub-cache/*" 2>/dev/null | head -n 1)
          fi
          if [ -z "$apk" ]; then
            echo "::error::No APK was produced by the build"
            exit 1
          fi
          echo "Using $apk"
          mkdir -p dist
          cp "$apk" "dist/soundwave-${TAG}.apk"
          ls -lh dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SoundWave ${{ steps.version.outputs.tag }}
          body: |
            SoundWave – Feel the Music

            **Install on Android**
            1. Download `soundwave-*.apk` below.
            2. Open the file on your phone and allow "Install unknown apps" when asked.
            3. Install and open SoundWave.

            Or try the web version: https://getsoundwave.vercel.app

            Notes:
            - This build was published automatically from the latest `main` branch.
            - Every release is signed with the same key, so updating from an older SoundWave does **not** need an uninstall. Only v1.3.4 and older (debug-signed) builds need one last uninstall.
            - Downloads and local library scanning work on Android; the web build streams only.
          files: dist/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
