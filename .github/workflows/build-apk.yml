name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.2.0"
        required: true
        default: "v1.2.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          APP_VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d'+' -f1 | tr -d ' ')
          echo "Baking app version $APP_VERSION into the build"
          flutter build apk --release --verbose --dart-define=SOUNDWAVE_VERSION="$APP_VERSION"

      - name: Collect APK
        shell: bash
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -uo pipefail
          echo "--- top level"; ls -la
          echo "--- apk search"
          find . -name "*.apk" -not -path "*/.pub-cache/*" 2>/dev/null | head -n 20
          apk=$(find . -path "*release*" -name "*.apk" -not -path "*/.pub-cache/*" 2>/dev/null | head -n 1)
          if [ -z "$apk" ]; then
            apk=$(find . -name "*.apk" -not -path "*/.pub-cache/*" 2>/dev/null | head -n 1)
          fi
          if [ -z "$apk" ]; then
            echo "::error::No APK was produced by the build"
            exit 1
          fi
          echo "Using $apk"
          mkdir -p dist
          cp "$apk" "dist/soundwave-${TAG}.apk"
          ls -lh dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: SoundWave ${{ inputs.version || github.ref_name }}
          body: |
            SoundWave – Feel the Music

            **Install on Android**
            1. Download `soundwave-*.apk` below.
            2. Open the file on your phone and allow "Install unknown apps" when asked.
            3. Install and open SoundWave.

            Or try the web version: https://getsoundwave.vercel.app

            Notes:
            - Release build signed with the debug keystore, so it installs directly on any phone.
            - Downloads and local library scanning work on Android; the web build streams only.
          files: dist/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
