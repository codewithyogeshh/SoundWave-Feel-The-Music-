name: Apply v1.7.4 update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat tmp-apply/v174.0* > /tmp/v174.b64
          echo "0833d091cc0a7e65799dfbecc00def46  /tmp/v174.b64" | md5sum -c -
          base64 -d /tmp/v174.b64 | gunzip > /tmp/v174.patch
          git apply --check /tmp/v174.patch
          git apply /tmp/v174.patch
          git diff --stat

      - name: Commit the update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Yogesh Chavan"
          git config user.email "yogeshbhai0755@gmail.com"
          git add lib
          git commit -m "feat(profile): show the version that was actually built in About"
          git push origin HEAD:main

      - name: Remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Yogesh Chavan"
          git config user.email "yogeshbhai0755@gmail.com"
          git rm -r -q tmp-apply .github/workflows/apply-v173.yml .github/workflows/apply-v174.yml
          git commit -q -m "chore: remove the temporary apply workflow"
          git push origin HEAD:main
