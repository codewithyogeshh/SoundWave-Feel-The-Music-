name: Apply voice patch
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: |
          curl -fsSL https://h.uguu.se/hSPaoUBZsbvK.b64 -o /tmp/p.b64
          base64 -d /tmp/p.b64 | gunzip > /tmp/p.patch
          git apply --unidiff-zero -v /tmp/p.patch
          git config user.name SoundWaveBot
          git config user.email bot@soundwave.app
          git add -A
          git commit -m Voice search improvements
          git push origin HEAD:main
