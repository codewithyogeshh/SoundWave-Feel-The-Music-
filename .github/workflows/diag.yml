name: Diag build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Setup
        env:
          KEYSTORE_BASE64: ${{ secrets.SOUNDWAVE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SOUNDWAVE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOUNDWAVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SOUNDWAVE_KEY_PASSWORD }}
        run: |
          set +e
          flutter pub get > /tmp/pub.log 2>&1; echo "PUB_EXIT=$?"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/soundwave-release.jks
          printf 'storeFile=soundwave-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - name: Build
        run: |
          set +e
          flutter build apk --release --build-name=1.7.35 --build-number=10735 \
            --dart-define=SOUNDWAVE_VERSION=1.7.35 > /tmp/build.log 2>&1
          echo "BUILD_EXIT=$?"
          df -h / /home/runner 2>/dev/null | head -n 6
          echo '--- meaningful tail'
          grep -v '^\[' /tmp/build.log | tr -d '\r' | grep -v 'Unzipping' | tail -n 40
