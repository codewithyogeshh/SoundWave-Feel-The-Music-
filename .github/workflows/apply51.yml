name: Apply patch 51
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://d.uguu.se/wGfQowRORPMJ.b64" | base64 -d | gunzip > /tmp/p.patch
          wc -l /tmp/p.patch
          git apply --unidiff-zero -v /tmp/p.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: download location setting, profile edit and compact developer card"
          git push origin HEAD:main
