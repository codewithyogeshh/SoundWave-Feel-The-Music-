name: Apply patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          curl -fsSL 'https://h.uguu.se/mMTJORngnsWf.b64' | base64 -d | gunzip > /tmp/p.patch
          wc -l /tmp/p.patch
          git apply --unidiff-zero -v /tmp/p.patch
          git -c user.name='Yogesh Chavan' -c user.email='yogeshbhai0755@gmail.com' commit -am 'feat(downloads): save to Music via MediaStore'
          git push origin HEAD:main
