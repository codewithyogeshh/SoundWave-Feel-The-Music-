name: CI

# The only analyze/test gate in the repo: pull requests, manual runs and the
# APK build all use it, so a failing check never turns into a release.
# Once the first green run is in, add:
#   push:
#     branches: [main]
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Analyzer errors and warnings fail the job. Infos are reported but do
      # not block, because the remaining ones are pre-existing framework
      # deprecations that are cleared in their own migration change.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
