name: Apply history sections patch
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and push
        run: |
          curl -fsSL https://n.uguu.se/BjzgnxncOUHC.b64 -o /tmp/p.b64
          base64 -d /tmp/p.b64 | gunzip > /tmp/p.patch
          git apply --unidiff-zero -v /tmp/p.patch
          git config user.name SoundWaveBot
          git config user.email bot@soundwave.app
          git add -A
          git commit -m "Group Recently Played by day and show play times" -m "Store last played time per track and split history into Today, Yesterday and Earlier sections."
          git push origin HEAD:main
