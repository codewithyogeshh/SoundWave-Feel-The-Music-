name: Apply voice patch
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Unpack patch
        run: |
          cat > /tmp/p.b64 <<'B64'
          
          B64
          tr -d '\n\r ' < /tmp/p.b64 | base64 -d | gunzip > /tmp/p.patch
          ls -l /tmp/p.patch
      - name: Apply and push
        run: |
          git apply --unidiff-zero -v /tmp/p.patch
          git config user.name SoundWaveBot
          git config user.email bot@soundwave.app
          git add -A
          git status --short
          git commit -m Voice search improvements
          git push origin HEAD:main
