name: Apply v1.6.8 patch

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch and push to main
        run: |
          set -euo pipefail
          cat tmp-apply/v168.a tmp-apply/v168.b tmp-apply/v168.c tmp-apply/v168.d > /tmp/p.b64
          base64 -d /tmp/p.b64 | gunzip > /tmp/p.patch
          git apply --whitespace=nowarn /tmp/p.patch
          git rm -r --quiet tmp-apply
          git config user.name "Yogesh Chavan"
          git config user.email "yogeshbhai0755@gmail.com"
          git add -A
          git commit -m "fix(widget): make the next-song row a proper tap target"
          git push origin HEAD:main
