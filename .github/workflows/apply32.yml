name: apply32
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: |
          git config user.email "yogeshbhai0755@gmail.com"
          git config user.name "Yogesh Chavan"
          curl -fsSL -o /tmp/p.b64 "https://n.uguu.se/bitlJovYfycA.b64"
          base64 -d /tmp/p.b64 | gunzip > /tmp/p.patch
          git apply --unidiff-zero -v /tmp/p.patch
          git add -A
          git commit -m "style(lyrics): plain unanimated lyric lines without colour"
          git push origin HEAD:main
