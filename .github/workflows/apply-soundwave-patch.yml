name: Apply SoundWave feature patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply remaining patch and push to main
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/soundwave-fix.patch.gz.b64 | gunzip > /tmp/feature.patch
          git apply --check /tmp/feature.patch
          git apply /tmp/feature.patch
          git config user.name "Yogesh Chavan"
          git config user.email "yogeshbhai0755@gmail.com"
          git add lib pubspec.yaml pubspec.lock
          git commit -m "feat(player): battery guard service and stop on swipe away"
          git push origin HEAD:main
