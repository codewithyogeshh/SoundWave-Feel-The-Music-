name: apply31
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: |
          git config user.email "yogeshbhai0755@gmail.com"
          git config user.name "Yogesh Chavan"
          curl -fsSL -o /tmp/p.b64 "https://h.uguu.se/NbpmKBdtYJOC.b64"
          base64 -d /tmp/p.b64 | gunzip > /tmp/p.patch
          git apply --3way /tmp/p.patch
          git add -A
          git commit -m "feat(search): paged endless search, reels trending and better queue"
          git push origin HEAD:main
