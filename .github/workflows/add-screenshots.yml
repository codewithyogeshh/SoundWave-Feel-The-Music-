name: Add screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download screenshots
        run: |
          mkdir -p /tmp/shots screenshots
          curl -fsSL -o /tmp/shots/home.jpg "https://drive.usercontent.google.com/download?id=1t03HKILW2XI53tygsMiXOdoiXOcFMWta&export=download&confirm=t"
          curl -fsSL -o /tmp/shots/profile.jpg "https://drive.usercontent.google.com/download?id=14FsyjdBmLjGvAd8ADKVMh49LN6LpRDdy&export=download&confirm=t"
          curl -fsSL -o /tmp/shots/now-playing.jpg "https://drive.usercontent.google.com/download?id=1sYMa-A8eLZMQcCvPBclQpllBvWZilrzQ&export=download&confirm=t"
          file /tmp/shots/*.jpg

      - name: Save resized screenshots
        run: |
          for name in home profile now-playing; do
            if command -v convert >/dev/null 2>&1; then
              convert "/tmp/shots/$name.jpg" -resize 480x "screenshots/$name.jpg"
            else
              cp "/tmp/shots/$name.jpg" "screenshots/$name.jpg"
            fi
          done
          ls -la screenshots

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add app screenshots for the README"
          git push
