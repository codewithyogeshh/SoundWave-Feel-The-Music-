name: apply36
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSL https://n.uguu.se/GbODnPbRhJxd.b64 -o /tmp/h.b64
          base64 -d /tmp/h.b64 | gunzip > /tmp/h.patch
          git apply --unidiff-zero -v /tmp/h.patch
          git config user.email a@b.c
          git config user.name a
          git commit -am "listening history"
          git push origin HEAD:main
