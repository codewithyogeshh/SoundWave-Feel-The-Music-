name: Apply voice patch v3
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply
        run: |
          set +e
          LOG=/tmp/log.txt
          : > $LOG
          curl -fsSL https://h.uguu.se/hSPaoUBZsbvK.b64 -o /tmp/p.b64 >> $LOG 2>&1
          echo curl_exit=$? >> $LOG
          base64 -d /tmp/p.b64 | gunzip > /tmp/p.patch >> $LOG 2>&1
          git apply --unidiff-zero -v /tmp/p.patch >> $LOG 2>&1
          echo apply_exit=$? >> $LOG
          git status --short >> $LOG 2>&1
          git config user.name SoundWaveBot >> $LOG 2>&1
          git config user.email bot@soundwave.app >> $LOG 2>&1
          git add -A >> $LOG 2>&1
          git commit -m Voice search improvements >> $LOG 2>&1
          echo commit_exit=$? >> $LOG
          git push origin HEAD:main >> $LOG 2>&1
          echo push_exit=$? >> $LOG
          cat $LOG
          gh issue create --title apply-log --body-file /tmp/log.txt
